name: Publish Tool to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      internal_user_id:
        description: 'Internal user slug (tools/<internal_user_id>/...)'
        required: true
      tool_name:
        description: 'Tool slug'
        required: true
      category:
        description: 'Portal category (mall or auction)'
        required: true
      tool_title:
        description: 'Display title for portal nav (optional)'
        required: false
      files_base64:
        description: 'Base64-encoded JSON array of {path, content, encoding?} for the full upload bundle'
        required: false
      html_base64:
        description: 'Legacy — base64-encoded sanitized index.html only'
        required: false
      job_id:
        description: 'Server job ID for callback'
        required: true
      callback_url:
        description: 'Server callback URL'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write sanitized tool bundle
        run: |
          PREFIX="tools/${{ inputs.internal_user_id }}/${{ inputs.tool_name }}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const prefix = process.env.PREFIX;
          let files;
          if (process.env.FILES_BASE64) {
            const raw = Buffer.from(process.env.FILES_BASE64, 'base64').toString('utf8');
            files = JSON.parse(raw);
          } else if (process.env.HTML_BASE64) {
            const html = Buffer.from(process.env.HTML_BASE64, 'base64').toString('utf8');
            files = [{ path: 'index.html', content: html }];
          } else {
            throw new Error('files_base64 or html_base64 input is required');
          }

          function flattenBundlePaths(bundle) {
            if (!bundle.length) return bundle;
            const split = bundle.map((f) =>
              String(f.path).replace(/\\/g, '/').split('/').filter(Boolean)
            );
            if (!split.every((segs) => segs.length > 1)) return bundle;
            let depth = 0;
            while (true) {
              const seg = split[0][depth];
              if (seg === undefined) break;
              if (!split.every((segs) => segs[depth] === seg)) break;
              depth++;
            }
            if (depth === 0) return bundle;
            return bundle.map((f) => ({
              ...f,
              path: String(f.path)
                .replace(/\\/g, '/')
                .split('/')
                .filter(Boolean)
                .slice(depth)
                .join('/'),
            }));
          }

          files = flattenBundlePaths(files);

          for (const file of files) {
            const dest = path.join(prefix, file.path);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            if (file.encoding === 'base64') {
              fs.writeFileSync(dest, Buffer.from(file.content, 'base64'));
            } else {
              fs.writeFileSync(dest, file.content, 'utf8');
            }
          }

          console.log(`Wrote ${files.length} file(s) under ${prefix}/`);
          NODE
        env:
          PREFIX: tools/${{ inputs.internal_user_id }}/${{ inputs.tool_name }}
          FILES_BASE64: ${{ inputs.files_base64 }}
          HTML_BASE64: ${{ inputs.html_base64 }}

      - name: Update tool registry and portal nav
        env:
          GITHUB_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          TOOL_NAME: ${{ inputs.tool_name }}
          TOOL_TITLE: ${{ inputs.tool_title }}
          CATEGORY: ${{ inputs.category }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const registryPath = 'toolbox/registry.json';
          const slug = process.env.TOOL_NAME;
          const category = (process.env.CATEGORY || 'mall').toLowerCase();
          if (!['mall', 'auction'].includes(category)) {
            throw new Error(`Invalid category "${category}" — use mall or auction`);
          }

          const titleFromSlug = (s) =>
            s.split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

          let registry = { baseUrl: process.env.GITHUB_PAGES_BASE, tools: {} };
          if (fs.existsSync(registryPath)) {
            registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          }
          registry.baseUrl = process.env.GITHUB_PAGES_BASE;
          registry.tools[slug] = {
            title: process.env.TOOL_TITLE || registry.tools[slug]?.title || titleFromSlug(slug),
            category,
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');
          console.log(`Registry updated: ${slug} → ${category}`);
          NODE

          node scripts/update-portal-nav.js

      - name: Push publish branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="publish/${{ inputs.internal_user_id }}-${{ inputs.tool_name }}-${{ github.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "tools/${{ inputs.internal_user_id }}/${{ inputs.tool_name }}/"
          git add toolbox/registry.json toolbox/index.html
          git commit -m "Publish tool: ${{ inputs.tool_name }} (${{ inputs.internal_user_id }})"
          git push -u origin "$BRANCH"

      - name: Create pull request
        id: pr
        env:
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.push.outputs.branch }}
          PUBLISH_PAT: ${{ secrets.PUBLISH_PAT }}
        run: |
          TITLE="Publish: ${{ inputs.tool_name }}"
          BODY="Automated publish from AI Tool Sandbox.

          - **Internal user:** \`${{ inputs.internal_user_id }}\`
          - **Tool:** \`${{ inputs.tool_name }}\`
          - **Category:** \`${{ inputs.category }}\`
          - **Path:** \`tools/${{ inputs.internal_user_id }}/${{ inputs.tool_name }}/\`

          Merge to deploy via GitHub Pages. Portal nav is updated in this PR."

          create_pr() {
            local token="$1"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/pulls" \
              -d "$(jq -n \
                --arg title "$TITLE" \
                --arg head "$BRANCH" \
                --arg body "$BODY" \
                '{title: $title, head: $head, base: "main", body: $body}')"
          }

          PR_URL=""
          PR_NUMBER="0"

          if [ -n "$PUBLISH_PAT" ]; then
            echo "Creating PR with PUBLISH_PAT..."
            if RESP=$(create_pr "$PUBLISH_PAT" 2>&1); then
              PR_URL=$(echo "$RESP" | jq -r .html_url)
              PR_NUMBER=$(echo "$RESP" | jq -r .number)
            else
              echo "::warning::PUBLISH_PAT failed: $RESP"
            fi
          fi

          if [ -z "$PR_URL" ] || [ "$PR_URL" = "null" ]; then
            echo "Falling back to pre-filled compare URL (open PR manually in one click)."
            ENCODED_TITLE=$(printf '%s' "$TITLE" | jq -sRr @uri)
            PR_URL="https://github.com/${GH_REPO}/compare/main...${BRANCH}?expand=1&title=${ENCODED_TITLE}"
            PR_NUMBER=0
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Callback to server
        if: steps.push.outcome == 'success' && steps.pr.outputs.pr_url != ''
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d "{
              \"jobId\": \"${{ inputs.job_id }}\",
              \"prUrl\": \"${{ steps.pr.outputs.pr_url }}\",
              \"prNumber\": ${{ steps.pr.outputs.pr_number }},
              \"runId\": \"${{ github.run_id }}\"
            }"
