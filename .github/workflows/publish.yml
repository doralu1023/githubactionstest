name: Publish Tool to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'publish = create/overwrite tool, delete = remove tool'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - delete
      internal_user_id:
        description: 'Internal user slug (branch naming + registry owner)'
        required: true
      tool_name:
        description: 'Tool slug'
        required: true
      category:
        description: 'Portal category (mall or auction) — required for publish'
        required: false
      tool_title:
        description: 'Display title for portal nav (optional)'
        required: false
      bundle_url:
        description: 'Server URL to GET file bundle (preferred — avoids 64KB input limit)'
        required: false
      files_base64:
        description: 'Legacy — base64-encoded JSON array of {path, content, encoding?}'
        required: false
      html_base64:
        description: 'Legacy — base64-encoded sanitized index.html only'
        required: false
      job_id:
        description: 'Server job ID for callback (optional for manual runs)'
        required: false
      callback_url:
        description: 'Server callback URL (optional for manual runs)'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          TOOL_NAME: ${{ inputs.tool_name }}
          CATEGORY: ${{ inputs.category }}
        run: |
          if ! printf '%s' "$TOOL_NAME" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::tool_name must be a lowercase slug ([a-z0-9-])"
            exit 1
          fi
          if [ "$ACTION" = "delete" ] && [ ! -d "toolbox/tools/$TOOL_NAME" ]; then
            echo "::error::Tool '$TOOL_NAME' does not exist — nothing to delete"
            exit 1
          fi
          if [ "$ACTION" != "delete" ] && [ -z "$CATEGORY" ]; then
            echo "::error::category is required when action=publish"
            exit 1
          fi

      # Same-name upload = full replace: wipe any previous version so stale
      # files from older uploads never survive an overwrite.
      - name: Clear previous tool version
        if: inputs.action != 'delete'
        env:
          TOOL_NAME: ${{ inputs.tool_name }}
        run: rm -rf "toolbox/tools/$TOOL_NAME"

      - name: Write sanitized tool bundle
        if: inputs.action != 'delete'
        env:
          PREFIX: toolbox/tools/${{ inputs.tool_name }}
          BUNDLE_URL: ${{ inputs.bundle_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          FILES_BASE64: ${{ inputs.files_base64 }}
          HTML_BASE64: ${{ inputs.html_base64 }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const prefix = process.env.PREFIX;

          async function loadFiles() {
            if (process.env.BUNDLE_URL) {
              const res = await fetch(process.env.BUNDLE_URL, {
                headers: { 'X-Callback-Secret': process.env.CALLBACK_SECRET || '' },
              });
              if (!res.ok) {
                const body = await res.text();
                throw new Error(`Bundle fetch failed (${res.status}): ${body.slice(0, 200)}`);
              }
              const payload = await res.json();
              if (!Array.isArray(payload.files) || !payload.files.length) {
                throw new Error('Bundle response missing files[]');
              }
              return payload.files;
            }
            if (process.env.FILES_BASE64) {
              const raw = Buffer.from(process.env.FILES_BASE64, 'base64').toString('utf8');
              return JSON.parse(raw);
            }
            if (process.env.HTML_BASE64) {
              const html = Buffer.from(process.env.HTML_BASE64, 'base64').toString('utf8');
              return [{ path: 'index.html', content: html }];
            }
            throw new Error('bundle_url, files_base64, or html_base64 is required');
          }

          function flattenBundlePaths(bundle) {
            if (!bundle.length) return bundle;
            const split = bundle.map((f) =>
              String(f.path).replace(/\\/g, '/').split('/').filter(Boolean)
            );
            if (!split.every((segs) => segs.length > 1)) return bundle;
            let depth = 0;
            while (true) {
              const seg = split[0][depth];
              if (seg === undefined) break;
              if (!split.every((segs) => segs[depth] === seg)) break;
              depth++;
            }
            if (depth === 0) return bundle;
            return bundle.map((f) => ({
              ...f,
              path: String(f.path)
                .replace(/\\/g, '/')
                .split('/')
                .filter(Boolean)
                .slice(depth)
                .join('/'),
            }));
          }

          async function main() {
            const bundle = await loadFiles();
            const files = flattenBundlePaths(bundle);
            for (const file of files) {
              const dest = path.join(prefix, file.path);
              fs.mkdirSync(path.dirname(dest), { recursive: true });
              if (file.encoding === 'base64') {
                fs.writeFileSync(dest, Buffer.from(file.content, 'base64'));
              } else {
                fs.writeFileSync(dest, file.content, 'utf8');
              }
            }
            // manifest.json lets the portal fetch + zip a tool's files client-side
            // (GitHub Pages has no directory listing).
            const manifest = {
              tool: path.basename(prefix),
              files: files
                .map((f) => String(f.path).replace(/\\/g, '/'))
                .filter((p) => p !== 'manifest.json')
                .sort(),
              updatedAt: new Date().toISOString(),
            };
            fs.writeFileSync(
              path.join(prefix, 'manifest.json'),
              JSON.stringify(manifest, null, 2) + '\n'
            );
            console.log(`Wrote ${files.length} file(s) + manifest.json under ${prefix}/`);
          }

          main().catch((err) => {
            console.error(err.message);
            process.exit(1);
          });
          NODE

      - name: Remove tool files
        if: inputs.action == 'delete'
        env:
          TOOL_NAME: ${{ inputs.tool_name }}
        run: rm -rf "toolbox/tools/$TOOL_NAME"

      - name: Update tool registry
        env:
          GITHUB_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          ACTION: ${{ inputs.action }}
          TOOL_NAME: ${{ inputs.tool_name }}
          TOOL_TITLE: ${{ inputs.tool_title }}
          CATEGORY: ${{ inputs.category }}
          INTERNAL_USER: ${{ inputs.internal_user_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const registryPath = 'toolbox/registry.json';
          const slug = process.env.TOOL_NAME;
          const action = process.env.ACTION || 'publish';

          let registry = { baseUrl: process.env.GITHUB_PAGES_BASE, tools: {} };
          if (fs.existsSync(registryPath)) {
            registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          }
          registry.baseUrl = process.env.GITHUB_PAGES_BASE;
          registry.tools = registry.tools || {};

          if (action === 'delete') {
            if (registry.tools[slug]) {
              delete registry.tools[slug];
              console.log(`Registry updated: removed ${slug}`);
            } else {
              console.log(`Registry: ${slug} not present — nothing to remove`);
            }
          } else {
            const category = (process.env.CATEGORY || 'mall').toLowerCase();
            if (!['mall', 'auction'].includes(category)) {
              throw new Error(`Invalid category "${category}" — use mall or auction`);
            }
            const titleFromSlug = (s) =>
              s.split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            registry.tools[slug] = {
              title: process.env.TOOL_TITLE || registry.tools[slug]?.title || titleFromSlug(slug),
              category,
              // owner is set on first publish and kept on overwrite, so a
              // re-upload by someone else stays attributed to the original owner.
              owner: registry.tools[slug]?.owner || process.env.INTERNAL_USER || 'unknown',
            };
            console.log(
              `Registry updated: ${slug} → ${category} (owner: ${registry.tools[slug].owner})`
            );
          }
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');
          NODE

      # On delete, rebuild the portal nav in the same PR so the dead link
      # disappears together with the tool.
      - name: Refresh portal nav
        if: inputs.action == 'delete'
        env:
          GITHUB_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/update-portal-nav.js

      - name: Push publish branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          TOOL_NAME: ${{ inputs.tool_name }}
          INTERNAL_USER: ${{ inputs.internal_user_id }}
        run: |
          BRANCH="${ACTION}/${INTERNAL_USER}-${TOOL_NAME}-${{ github.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A -- "toolbox/tools/$TOOL_NAME" toolbox/registry.json
          if [ "$ACTION" = "delete" ]; then
            git add toolbox/index.html
            git commit -m "Delete tool: $TOOL_NAME ($INTERNAL_USER)"
          else
            git commit -m "Publish tool: $TOOL_NAME ($INTERNAL_USER)"
          fi
          git push -u origin "$BRANCH"

      - name: Create pull request
        id: pr
        env:
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.push.outputs.branch }}
          PUBLISH_PAT: ${{ secrets.PUBLISH_PAT }}
          ACTION: ${{ inputs.action }}
          TOOL_NAME: ${{ inputs.tool_name }}
          INTERNAL_USER: ${{ inputs.internal_user_id }}
          CATEGORY: ${{ inputs.category }}
        run: |
          if [ "$ACTION" = "delete" ]; then
            TITLE="Delete: ${TOOL_NAME}"
            DETAIL="**Removes:** \`toolbox/tools/${TOOL_NAME}/\` + registry entry + portal nav link"
            FOOTER="Merge to remove the tool from GitHub Pages."
          else
            TITLE="Publish: ${TOOL_NAME}"
            DETAIL="**Path:** \`toolbox/tools/${TOOL_NAME}/\` (previous version fully replaced)"
            FOOTER="Merge to deploy via GitHub Pages. Portal nav updates after the tool page is live."
          fi

          BODY=$(printf '%s\n\n- **Internal user:** `%s`\n- **Tool:** `%s`\n- **Category:** `%s`\n- %s\n\n%s' \
            "Automated ${ACTION} from AI Tool Sandbox." \
            "$INTERNAL_USER" "$TOOL_NAME" "${CATEGORY:-n/a}" "$DETAIL" "$FOOTER")

          create_pr() {
            local token="$1"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/pulls" \
              -d "$(jq -n \
                --arg title "$TITLE" \
                --arg head "$BRANCH" \
                --arg body "$BODY" \
                '{title: $title, head: $head, base: "main", body: $body}')"
          }

          PR_URL=""
          PR_NUMBER="0"

          if [ -n "$PUBLISH_PAT" ]; then
            echo "Creating PR with PUBLISH_PAT..."
            if RESP=$(create_pr "$PUBLISH_PAT" 2>&1); then
              PR_URL=$(echo "$RESP" | jq -r .html_url)
              PR_NUMBER=$(echo "$RESP" | jq -r .number)
            else
              echo "::warning::PUBLISH_PAT failed: $RESP"
            fi
          fi

          if [ -z "$PR_URL" ] || [ "$PR_URL" = "null" ]; then
            echo "Falling back to pre-filled compare URL (open PR manually in one click)."
            ENCODED_TITLE=$(printf '%s' "$TITLE" | jq -sRr @uri)
            PR_URL="https://github.com/${GH_REPO}/compare/main...${BRANCH}?expand=1&title=${ENCODED_TITLE}"
            PR_NUMBER=0
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.pr.outputs.pr_url != '' && secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ACTION: ${{ inputs.action }}
          TOOL_NAME: ${{ inputs.tool_name }}
          INTERNAL_USER: ${{ inputs.internal_user_id }}
          CATEGORY: ${{ inputs.category }}
        run: |
          PR_LABEL="${PR_NUMBER}"
          if [ -z "$PR_LABEL" ] || [ "$PR_LABEL" = "0" ]; then PR_LABEL="open PR"; else PR_LABEL="#${PR_LABEL}"; fi
          HEADER="New publish PR — please review and merge"
          if [ "$ACTION" = "delete" ]; then
            HEADER="Tool DELETE PR — please review and merge"
          fi
          TEXT=":github: *${HEADER}*
          • *Tool:* ${TOOL_NAME}
          • *Action:* ${ACTION}
          • *Submitted by:* ${INTERNAL_USER}
          • *Category:* ${CATEGORY:-n/a}
          • *PR:* <${PR_URL}|${PR_LABEL}>"
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text "$TEXT" '{text: $text}')"

      - name: Callback to server
        if: steps.push.outcome == 'success' && steps.pr.outputs.pr_url != '' && inputs.callback_url != ''
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d "{
              \"jobId\": \"${{ inputs.job_id }}\",
              \"prUrl\": \"${{ steps.pr.outputs.pr_url }}\",
              \"prNumber\": ${{ steps.pr.outputs.pr_number }},
              \"runId\": \"${{ github.run_id }}\"
            }"
