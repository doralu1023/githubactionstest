name: Publish Tool to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      supplier_id:
        description: 'Supplier slug (tools/<supplier_id>/...)'
        required: true
      tool_name:
        description: 'Tool slug'
        required: true
      html_base64:
        description: 'Base64-encoded sanitized index.html'
        required: true
      job_id:
        description: 'Server job ID for callback'
        required: true
      callback_url:
        description: 'Server callback URL'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write sanitized tool
        run: |
          PREFIX="tools/${{ inputs.supplier_id }}/${{ inputs.tool_name }}"
          mkdir -p "$PREFIX"
          echo "${{ inputs.html_base64 }}" | base64 -d > "$PREFIX/index.html"
          echo "Wrote $PREFIX/index.html"

      - name: Push publish branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="publish/${{ inputs.supplier_id }}-${{ inputs.tool_name }}-${{ github.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "tools/${{ inputs.supplier_id }}/${{ inputs.tool_name }}/"
          git commit -m "Publish tool: ${{ inputs.tool_name }} (${{ inputs.supplier_id }})"
          git push -u origin "$BRANCH"

      - name: Create pull request
        id: pr
        env:
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.push.outputs.branch }}
          PUBLISH_PAT: ${{ secrets.PUBLISH_PAT }}
        run: |
          TITLE="Publish: ${{ inputs.tool_name }}"
          BODY="Automated publish from AI Tool Sandbox.

          - **Supplier:** \`${{ inputs.supplier_id }}\`
          - **Tool:** \`${{ inputs.tool_name }}\`
          - **Path:** \`tools/${{ inputs.supplier_id }}/${{ inputs.tool_name }}/\`

          Merge to deploy via GitHub Pages."

          create_pr() {
            local token="$1"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/pulls" \
              -d "$(jq -n \
                --arg title "$TITLE" \
                --arg head "$BRANCH" \
                --arg body "$BODY" \
                '{title: $title, head: $head, base: "main", body: $body}')"
          }

          PR_URL=""
          PR_NUMBER="0"

          if [ -n "$PUBLISH_PAT" ]; then
            echo "Creating PR with PUBLISH_PAT..."
            if RESP=$(create_pr "$PUBLISH_PAT" 2>&1); then
              PR_URL=$(echo "$RESP" | jq -r .html_url)
              PR_NUMBER=$(echo "$RESP" | jq -r .number)
            else
              echo "::warning::PUBLISH_PAT failed: $RESP"
            fi
          fi

          if [ -z "$PR_URL" ] || [ "$PR_URL" = "null" ]; then
            # GITHUB_TOKEN is often blocked from createPullRequest unless the repo enables:
            # Settings → Actions → General → Allow GitHub Actions to create and approve pull requests
            echo "Falling back to pre-filled compare URL (open PR manually in one click)."
            ENCODED_TITLE=$(printf '%s' "$TITLE" | jq -sRr @uri)
            PR_URL="https://github.com/${GH_REPO}/compare/main...${BRANCH}?expand=1&title=${ENCODED_TITLE}"
            PR_NUMBER=0
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Callback to server
        if: steps.push.outcome == 'success' && steps.pr.outputs.pr_url != ''
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d "{
              \"jobId\": \"${{ inputs.job_id }}\",
              \"prUrl\": \"${{ steps.pr.outputs.pr_url }}\",
              \"prNumber\": ${{ steps.pr.outputs.pr_number }},
              \"runId\": \"${{ github.run_id }}\"
            }"
