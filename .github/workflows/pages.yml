name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'toolbox/**'
      - 'index.html'
      - 'main.js'
      - 'style.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (sandbox UI + published tools)
        run: |
          mkdir -p _site
          cp index.html main.js style.css _site/
          if [ -d toolbox ]; then cp -r toolbox _site/toolbox; fi
          if [ -d docs ]; then cp -r docs _site/docs; fi
          touch _site/.nojekyll
          echo "Site root:"
          ls -la _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
