name: Update Internal User Portal Nav

on:
  push:
    branches: [main]
    paths:
      - 'toolbox/tools/**'
      - 'toolbox/registry.json'
      - 'scripts/update-portal-nav.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate portal nav from registry
        env:
          GITHUB_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          node scripts/update-portal-nav.js --write-registry-for-new

      - name: Commit portal updates if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet toolbox/index.html toolbox/registry.json; then
            echo "Portal nav already up to date."
            exit 0
          fi

          git add toolbox/index.html toolbox/registry.json
          git commit -m "chore(portal): auto-update toolbox nav after tool merge"
          git push
