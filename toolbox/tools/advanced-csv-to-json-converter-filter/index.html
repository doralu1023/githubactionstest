<!DOCTYPE html><html><head>
<meta charset="UTF-8">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSV to JSON Converter &amp; Filter</title>
    <link rel="stylesheet" href="./style.css">

<meta http-equiv="Content-Security-Policy" content="default-src 'unsafe-inline' data: blob: 'self'; script-src 'unsafe-inline' data: blob: 'self'; style-src 'unsafe-inline' data: blob: 'self'; img-src 'unsafe-inline' data: blob: 'self'; font-src 'unsafe-inline' data: blob: 'self'; connect-src 'none';">
</head><body>
    <header class="app-header">
        <div class="header-container">
            <h1>Advanced CSV to JSON Converter</h1>
            <button id="themeToggle" class="btn btn-secondary" aria-label="Toggle dark mode">
                <span class="mode-icon-light">☀️ Light Mode</span>
                <span class="mode-icon-dark">🌙 Dark Mode</span>
            </button>
        </div>
    </header>

    <main class="app-container">
        <section class="card upload-section">
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" width="48" height="48">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"></path>
                    </svg>
                    <p class="drop-zone-text">Drag &amp; drop your transaction log CSV here or <span class="browse-link">browse</span></p>
                    <p class="drop-zone-limits">Supports .csv files up to 5MB</p>
                </div>
                <input type="file" id="fileInput" accept=".csv" class="file-input">
            </div>
            <div id="fileInfo" class="file-info hidden">
                <span class="file-name" id="fileName">logfile.csv</span>
                <span class="file-size" id="fileSize">(0 KB)</span>
                <button id="removeFileBtn" class="btn-icon" title="Remove file">×</button>
            </div>
        </section>

        <div id="workspace" class="workspace-area hidden">
            
            <section class="card controls-section">
                <div class="filter-group">
                    <label for="statusFilter" class="field-label">Filter by Status Code</label>
                    <input type="text" id="statusFilter" class="form-control" placeholder="e.g., 500, 404 (Comma separated or exact text)">
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="hideEmptyColsCheckbox">
                        <span class="checkbox-custom"></span>
                        Hide Empty Columns
                    </label>
                </div>
                <div class="actions-group">
                    <button id="exportJsonBtn" class="btn btn-primary">
                        <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path></svg>
                        Export JSON
                    </button>
                    <button id="copyClipboardBtn" class="btn btn-secondary">
                        <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"></path></svg>
                        Copy to Clipboard
                    </button>
                </div>
            </section>

            <div id="metricsSummary" class="metrics-summary">
                Showing <strong id="visibleCount">0</strong> of <strong id="totalCount">0</strong> records found.
            </div>

            <section class="card preview-section">
                <div class="table-container">
                    <table id="previewTable" class="preview-table">
                        <thead id="tableHeader"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div id="noDataMessage" class="no-data-message hidden">No rows match your filter criteria.</div>
                </div>

                <div class="pagination-container">
                    <div class="pagination-info">
                        Page <span id="currentPageNum">1</span> of <span id="totalPageNum">1</span>
                    </div>
                    <div class="pagination-controls">
                        <button id="prevPageBtn" class="btn btn-sm btn-secondary" disabled="">&lt; Previous</button>
                        <button id="nextPageBtn" class="btn btn-sm btn-secondary" disabled="">Next &gt;</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="./main.js"></script>

</body></html>
